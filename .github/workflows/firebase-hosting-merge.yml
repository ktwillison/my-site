# Deploys the site on every push to master:
#   1. builds server/ and deploys it to the Cloud Run service `my-site`,
#   2. releases Firebase Hosting, which forwards every request to that service.
# Hosting goes second because each release purges the CDN, so cached pages are
# re-fetched from the new server.
#
# The service account in FIREBASE_SERVICE_ACCOUNT_MY_WEBSITE_43874 needs these roles
# on the project: Firebase Hosting Admin, Service Usage Consumer, Cloud Run Source
# Developer, and Service Account User (for the Cloud Run service's runtime account).

name: Deploy to Cloud Run and Firebase Hosting on merge
'on':
  push:
    branches:
      - master
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_WEBSITE_43874 }}'
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: my-site
          region: us-central1
          project_id: my-website-43874
          source: server
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_WEBSITE_43874 }}'
          channelId: live
          projectId: my-website-43874
